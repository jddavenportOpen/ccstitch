name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest
      - name: CLI smoke
        shell: bash
        run: |
          ccstitch --version
          ccstitch install --dry-run --settings "$RUNNER_TEMP/settings.json"
          rc=0; ccstitch status || rc=$?
          test "$rc" -eq 1   # no collector running in CI: status must say so, not crash
