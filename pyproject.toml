[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ccstitch"
version = "0.1.0"
description = "Local trace store for Claude Code's OpenTelemetry spans that repairs orphaned headless turns (anthropics/claude-code#99607) and stitches claude -p children under the tool call that launched them."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JD Davenport" }]
keywords = ["claude-code", "opentelemetry", "otlp", "tracing", "genai", "observability", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Monitoring",
  "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
ccstitch = "ccstitch.cli:main"

[project.urls]
Homepage = "https://github.com/jddavenportOpen/ccstitch"
Issues = "https://github.com/jddavenportOpen/ccstitch/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ccstitch = ["viewer.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
